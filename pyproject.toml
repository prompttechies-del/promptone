[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptone"
version = "0.4.17"
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[tool.setuptools]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery bails out.
packages = ["promptone", "promptone.backends", "promptone.mcp", "promptone.integrations"]

[tool.setuptools.package-data]
# the browser playground promptone-serve hosts at /ui
promptone = ["ui/*.html", "ui/*.webp"]

[project.optional-dependencies]
# `pip install promptone[serve]` adds the HTTP server (promptone.serve / the promptone-serve CLI).
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",  # examples/server.py form uploads
]
# `pip install promptone[fast]` adds the TileLang GPU fast path (promptone/fast.py); everything else works without it.
fast = ["tilelang>=0.1.14"]

# `pip install promptone[mcp]` adds the MCP stdio server (promptone.mcp / the promptone-mcp-server CLI).
mcp = ["mcp>=2.2.0"]

# `pip install promptone[structured]` adds pydantic for the typed-model helpers (promptone/structured.py).
structured = ["pydantic>=2.0.0"]

# `pip install promptone[onnx]` adds ONNX Runtime for `promptone.onnx_agent` and `onnxscript`, which
# `torch.onnx.export` requires (`scripts/export_onnx.py`, `tests/test_onnx.py`).
#
# The NumPy cap is not about ONNX: the extra's own resolution (onnx -> ml-dtypes) otherwise
# pulls NumPy 2, and torch below 2.3 is built against NumPy 1.x and raises "Numpy is not
# available" when it converts a tensor against 2.x, which `predict()` needs for its final
# `.numpy()`. This package declares `torch>=2.0.0`, so the extra must not force a NumPy the
# declared floor cannot use.
#
# It is scoped by marker rather than written as a blanket `numpy<2`, because a hard upper cap
# binds every `promptone[onnx]` install -- including the many on a current torch -- and makes the
# extra unresolvable next to anything else requiring `numpy>=2`. The marker names the stack this
# actually affects: the macOS/Intel checkout (#948), where torch tops out at 2.2.2 and NumPy 1.26
# satisfies onnx, onnxruntime and onnxscript. Every other platform resolves what `onnx` wants,
# so none of those three is quietly pinned to NumPy 1.x on its behalf.
onnx = ["onnx", "onnxruntime", "onnxscript",
        "numpy<2; platform_system == 'Darwin' and platform_machine == 'x86_64'"]

# `pip install promptone[langchain]` adds the LangChain / LangGraph integrations (promptone.integrations).
langchain = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]
langgraph = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]

# `pip install promptone[llamaindex]` adds the LlamaIndex query router & selector integrations (promptone.integrations).
llamaindex = [
    "llama-index-core>=0.10.0",
]

# `pip install promptone[crewai]` adds the CrewAI multi-agent delegation router (promptone.integrations).
crewai = [
    "crewai>=0.28.0",
]

# `pip install promptone[agno]` adds the Agno multi-agent team routing and guardrail integration (promptone.integrations).
agno = [
    "agno>=1.1.14,<4",
]

[project.scripts]
promptone = "promptone.cli:main"
promptone-serve = "promptone.serve:main"
promptone-evals = "promptone.evals_cli:main"
promptone-mcp-server = "promptone.mcp.server:main"
promptone-train = "promptone.train_cli:main"

[project.urls]
Homepage = "https://huggingface.co/zameer1/promptone"
Demo = "https://huggingface.co/spaces/zameer1/promptone-demo"
